name: Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tools/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright package
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install ffmpeg
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No system Chrome/Chromium found on runner"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gridiron-preview.log 2>&1 &
          echo $! > /tmp/gridiron-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gridiron-preview.log
          exit 1

      - name: Run Playwright visual QA
        run: node tools/visual-qa.mjs

      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.sha }}
          path: artifacts/visual-qa
          retention-days: 7
