name: Vendor Humanoid QB Base

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-humanoid-base.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download audited CC0 Quaternius assets
        run: |
          mkdir -p public/assets/vendor/quaternius docs
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/night-striker.glb' \
            -o public/assets/vendor/quaternius/humanoid-base.glb
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/universal-animation-library.glb' \
            -o public/assets/vendor/quaternius/universal-animation-library.glb
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/LICENSE-BASE-CHARACTERS.txt' \
            -o public/assets/vendor/quaternius/LICENSE-BASE-CHARACTERS.txt
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/LICENSE-ANIMATIONS.txt' \
            -o public/assets/vendor/quaternius/LICENSE-ANIMATIONS.txt

      - name: Inspect glTF names
        run: |
          python - <<'PY'
          import json, struct, pathlib

          def glb_json(path):
              with open(path,'rb') as f:
                  magic, version, total = struct.unpack('<III', f.read(12))
                  assert magic == 0x46546C67 and version == 2
                  n, typ = struct.unpack('<II', f.read(8))
                  assert typ == 0x4E4F534A
                  return json.loads(f.read(n).decode('utf-8').rstrip('\x00 \t\r\n'))

          base = glb_json('public/assets/vendor/quaternius/humanoid-base.glb')
          anim = glb_json('public/assets/vendor/quaternius/universal-animation-library.glb')

          out = {
              'source': 'Quaternius Universal Base Characters / Universal Animation Library, CC0 1.0',
              'base': {
                  'nodes': [n.get('name') for n in base.get('nodes',[]) if n.get('name')],
                  'meshes': [m.get('name') for m in base.get('meshes',[])],
                  'materials': [m.get('name') for m in base.get('materials',[])],
                  'skins': [s.get('name') for s in base.get('skins',[])],
              },
              'animations': [a.get('name') for a in anim.get('animations',[])],
          }
          pathlib.Path('docs/humanoid-base-inspect.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Commit vendored reference assets
        run: |
          git config user.name 'gridiron-assets-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/vendor/quaternius docs/humanoid-base-inspect.json
          if git diff --cached --quiet; then
            echo 'Humanoid assets already current.'
            exit 0
          fi
          git commit -m 'Vendor real humanoid QB base assets'
          git push
