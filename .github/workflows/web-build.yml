name: Web Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'sprite-studio.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.nvmrc'
      - '.github/workflows/web-build.yml'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm install
      - run: npm run build
      - run: npx wrangler deploy --dry-run
