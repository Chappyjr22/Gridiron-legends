name: Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check src/state/league.js
      - run: node tests/data.test.mjs
      - run: node tests/save-compatibility.test.mjs
      - run: node tests/audio.test.mjs
      - run: npm run test:gameplay
      - run: npm run test:career
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-browser-evidence
          path: test-results/
          retention-days: 14
